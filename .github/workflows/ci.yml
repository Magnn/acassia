name: Meu Mistério CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: "sqlite:///test.db"
  FLASK_SECRET_KEY: "ci-test-key-not-for-production"

jobs:
  # ── Lint + Type Check ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Lint with Ruff
        run: |
          ruff check . --output-format=github --select=E,F,W --ignore=E501,E402

  # ── Tests ──
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meumisterio_test
          POSTGRES_USER: meumisterio
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests (SQLite)
        env:
          DATABASE_URL: "sqlite:///test.db"
        run: |
          python -c "from db.database import engine, Base; from db.models import *; Base.metadata.create_all(bind=engine)"
          pytest tests/ -v --tb=short -x --co -q 2>/dev/null | head -5 || true
          pytest tests/ -v --tb=short -x

      - name: Run tests (PostgreSQL)
        env:
          DATABASE_URL: "postgresql://meumisterio:test_password@localhost:5432/meumisterio_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python -c "from db.database import engine, Base; from db.models import *; Base.metadata.create_all(bind=engine)"
          pytest tests/ -v --tb=short -x --cov=. --cov-report=term-missing:skip-covered

      - name: Verify health endpoint
        env:
          DATABASE_URL: "sqlite:///test.db"
        run: |
          python -c "
          from db.database import engine, Base
          from db.models import *
          Base.metadata.create_all(bind=engine)
          from app import app
          client = app.test_client()
          r = client.get('/api/health')
          assert r.status_code == 200, f'Health check failed: {r.status_code}'
          print('✅ Health check passed')
          "

  # ── Docker Build ──
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t meumisterio-app:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run --rm -d --name meumisterio-test \
            -e DATABASE_URL=sqlite:///test.db \
            -e FLASK_SECRET_KEY=docker-test \
            -p 5000:5000 \
            meumisterio-app:${{ github.sha }}
          sleep 10
          curl -f http://localhost:5000/api/health || exit 1
          docker stop meumisterio-test
          echo "✅ Docker image works"
