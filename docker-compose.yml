# docker-compose.yml — Meu Mistério SaaS Stack Completa
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Uso:
#   docker compose up -d              # sobe tudo
#   docker compose logs -f app        # logs do app
#   docker compose exec app alembic upgrade head  # migrar DB

services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    container_name: meumisterio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: meumisterio
      POSTGRES_USER: meumisterio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meumisterio_2026_secure}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meumisterio -d meumisterio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (cache + rate limit + distributed locks) ──
  # Em prod, use Upstash (já configurado no .env)
  # Este serviço é para dev local
  redis:
    image: redis:7-alpine
    container_name: meumisterio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Aplicação Flask (Meu Mistério) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meumisterio-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL para usar PostgreSQL do container
      DATABASE_URL: postgresql://meumisterio:${POSTGRES_PASSWORD:-meumisterio_2026_secure}@db:5432/meumisterio
      # Redis local (se não usar Upstash)
      # REDIS_URL: redis://redis:6379/0
      # Gunicorn workers
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    volumes:
      # Persistir downloads/media entre deploys
      - ./downloads:/app/downloads
      - ./media:/app/media
      - ./scripts/reports:/app/scripts/reports

  # ── Background Task Worker (Broadcasts & Sequences) ──
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meumisterio-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meumisterio:${POSTGRES_PASSWORD:-meumisterio_2026_secure}@db:5432/meumisterio
    command: python task_worker.py
    volumes:
      - ./downloads:/app/downloads
      - ./media:/app/media
      - ./scripts/reports:/app/scripts/reports

  # ── Alembic Migration Runner (one-shot) ──
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meumisterio-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meumisterio:${POSTGRES_PASSWORD:-meumisterio_2026_secure}@db:5432/meumisterio
    command: >
      sh -c "python -c 'from db.database import engine, Base; from db.models import *; Base.metadata.create_all(bind=engine)' && 
             echo '✅ Database tables created/synced'"
    profiles:
      - tools

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
