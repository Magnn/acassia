<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meu Mistério SaaS{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'meumisterio-purple': '#7c3aed',
            'meumisterio-bg': '#0f172a',
            'meumisterio-surface': '#1e293b',
            'meumisterio-border': '#334155',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-meumisterio-bg text-slate-100 min-h-screen">
  <main class="{% block main_class %}max-w-md mx-auto py-12 px-6{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for cat, msg in messages %}
            <div class="rounded p-3 text-sm {% if cat == 'error' %}bg-red-900/40 border border-red-800 text-red-200{% else %}bg-emerald-900/40 border border-emerald-800 text-emerald-200{% endif %}">
              {{ msg }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
