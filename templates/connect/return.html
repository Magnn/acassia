{% extends "base.html" %}
{% block title %}Voltando do Stripe — Cigana SaaS{% endblock %}
{% block content %}
<div class="text-center">
  <div class="text-5xl mb-4">⏳</div>
  <h1 class="text-2xl font-bold mb-2">Recebemos teus dados</h1>
  <p class="text-slate-400 text-sm mb-6">
    A Stripe está processando teu KYC. Em até 24h libera pagamentos e payouts.
    Você pode acompanhar o status na página de Connect.
  </p>
  <a href="{{ url_for('saas_connect.status') }}"
     class="inline-block bg-cigana-purple hover:bg-purple-600 transition py-2 px-6 rounded-lg font-bold">
    Ver status
  </a>
</div>
{% endblock %}
