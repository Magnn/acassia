{% extends "base.html" %}
{% block title %}Criar conta — Meu Mistério SaaS{% endblock %}
{% block content %}
<div class="text-center mb-8">
  <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-purple-600/30 text-white font-black">
    ⚡
  </div>
  <h1 class="text-3xl font-extrabold mb-1 tracking-tight text-white">Criar Conta na Acássia</h1>
  <p class="text-slate-400 text-sm">Plataforma de Funis e IA de Vendas para WhatsApp</p>
</div>
<form method="POST" action="{{ url_for('saas_auth.signup') }}" class="space-y-4">
  <div>
    <label for="name" class="block mb-1 text-sm text-slate-300">Nome</label>
    <input type="text" id="name" name="name" maxlength="200" autocomplete="name"
           class="w-full px-3 py-2 rounded-lg bg-meumisterio-surface border border-meumisterio-border focus:border-meumisterio-purple focus:outline-none">
  </div>
  <div>
    <label for="email" class="block mb-1 text-sm text-slate-300">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email"
           class="w-full px-3 py-2 rounded-lg bg-meumisterio-surface border border-meumisterio-border focus:border-meumisterio-purple focus:outline-none">
  </div>
  <div>
    <label for="password" class="block mb-1 text-sm text-slate-300">Senha</label>
    <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
           class="w-full px-3 py-2 rounded-lg bg-meumisterio-surface border border-meumisterio-border focus:border-meumisterio-purple focus:outline-none">
    <p class="mt-1 text-xs text-slate-500">Mínimo 8 caracteres</p>
  </div>
  <button type="submit"
          class="w-full bg-meumisterio-purple hover:bg-purple-600 transition py-2 rounded-lg font-bold">
    Criar conta
  </button>
</form>
<p class="mt-6 text-center text-sm text-slate-400">
  Já tem conta?
  <a href="{{ url_for('saas_auth.login') }}" class="text-meumisterio-purple hover:underline">Entrar</a>
</p>
{% endblock %}
