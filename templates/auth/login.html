{% extends "base.html" %}
{% block title %}Entrar — Meu Mistério SaaS{% endblock %}
{% block content %}
<div class="text-center mb-8">
  <h1 class="text-3xl font-bold mb-2">🔮 Meu Mistério</h1>
  <p class="text-slate-400 text-sm">Entrar na plataforma</p>
</div>
<form method="POST" action="{{ url_for('saas_auth.login') }}" class="space-y-4">
  <div>
    <label for="email" class="block mb-1 text-sm text-slate-300">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email"
           class="w-full px-3 py-2 rounded-lg bg-meumisterio-surface border border-meumisterio-border focus:border-meumisterio-purple focus:outline-none">
  </div>
  <div>
    <label for="password" class="block mb-1 text-sm text-slate-300">Senha</label>
    <input type="password" id="password" name="password" required minlength="8" autocomplete="current-password"
           class="w-full px-3 py-2 rounded-lg bg-meumisterio-surface border border-meumisterio-border focus:border-meumisterio-purple focus:outline-none">
  </div>
  <button type="submit"
          class="w-full bg-meumisterio-purple hover:bg-purple-600 transition py-2 rounded-lg font-bold">
    Entrar
  </button>
</form>
<p class="mt-6 text-center text-sm text-slate-400">
  Ainda não tem conta?
  <a href="{{ url_for('saas_auth.signup') }}" class="text-meumisterio-purple hover:underline">Criar agora</a>
</p>
{% endblock %}
